<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>REVELation PIP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- This page is served without a key and runs with the wrapper's presentation preload. Only its own
       script runs (no inline script, so a javascript: or data: URL cannot execute here), and it may
       frame only http(s) pages. connect-src is for Vite's own HMR client, which the dev server injects;
       the page script makes no requests. The checks in js/pip-core.js are the first line; this is the
       backstop. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' ws: wss:; frame-src http: https:; base-uri 'none'; object-src 'none'; form-action 'none'" />
  <style>
    :root {
      --pip-color: #00ff00;
      --pip-size: 100vw;
      --pip-transition: 360ms ease;
      --chroma-size: 0vw;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .pip-container {
      display: grid;
      grid-template-columns: var(--pip-size) var(--chroma-size);
      grid-template-areas: "frame chroma";
      width: 100vw;
      height: 100vh;
      background: #000;
      transition: grid-template-columns var(--pip-transition);
    }
    .pip-left .pip-container {
      grid-template-columns: var(--chroma-size) var(--pip-size);
      grid-template-areas: "chroma frame";
    }
    .chroma-area {
      grid-area: chroma;
      background: var(--pip-color);
    }
    .pip-frame {
      grid-area: frame;
      min-width: 0;
    }
    .pip-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
    .pip-mode {
      --pip-size: 62vw;
      --chroma-size: calc(100vw - var(--pip-size));
    }
    .pip-error {
      color: #fff;
      font-family: system-ui, sans-serif;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="pip-container">
    <div class="chroma-area" id="chromaArea"></div>
    <div class="pip-frame">
      <iframe id="presentationFrame" title="Presentation"></iframe>
    </div>
  </div>
  <script type="module" src="/js/pip.js"></script>
</body>
</html>
